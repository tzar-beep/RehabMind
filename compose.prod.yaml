# Production-like, self-hosted RehabMind stack ($0: no paid services, no API keys).
#
#   python scripts/generate_prod_env.py            # once: writes .env.production
#   docker compose --env-file .env.production -f compose.prod.yaml up -d --build
#
# Only Caddy publishes ports (HTTPS). Each service receives only the secrets it needs.
name: rehabmind-prod

x-backend-env: &backend-env
  APP_ENV: production
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: rehabmind
  POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
  POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?}
  REDIS_URL: redis://redis:6379/0
  REDIS_PASSWORD: ${REDIS_PASSWORD:?}
  S3_ENDPOINT_URL: http://minio:9000
  S3_BUCKET_AUDIO: ephemeral-audio
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?}
  AUDIO_ENCRYPTION_KEY: ${AUDIO_ENCRYPTION_KEY:?}
  FRONTEND_ORIGINS: '["https://${SITE_ADDRESS:-localhost}"]'
  AI_PROVIDER: fake
  AI_FAKE_FAULT_RATE: "0"

services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:8.8-alpine@sha256:0b2b77d3ea5078274795e3177cdbdada8b96316684a38911d528534ed679b5ec
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio@sha256:4cf4831a2bbcf13ddca09c1cbcc9faff716dd3c4247e0babc32864b8ee8e0034
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_BROWSER: "off"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # One-shot: schema migrations (as the schema-owner role) + curated picture library.
  migrate:
    build: ./backend
    image: rehabmind-backend
    environment: *backend-env
    command: ["sh", "-c", "alembic upgrade head && python -m app.scripts.sync_stimuli"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # One-shot: private bucket, lifecycle, least-privilege app user. Only place with root keys.
  storage-init:
    image: rehabmind-backend
    environment:
      <<: *backend-env
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    command: ["python", "-m", "app.scripts.provision_storage", "--confirm-production"]
    depends_on:
      minio: { condition: service_started }
      migrate: { condition: service_completed_successfully }
    restart: "no"

  api:
    image: rehabmind-backend
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    image: rehabmind-backend
    environment: *backend-env
    command: ["python", "-m", "app.workers.main"]
    healthcheck:
      disable: true  # no HTTP server; the image's API healthcheck does not apply
    volumes:
      - whisper-models:/home/app/.cache
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://api:8000
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  caddy:
    image: caddy:2.11.2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  whisper-models:
  caddy-data:
